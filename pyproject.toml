[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easybrowser-local-api-sdk"
version = "0.1.6"
description = "EasyBrowser local API SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "loguru>=0.7",
    "patchright",
    "PySocks>=1.7",
]

[project.urls]
Homepage = "https://easybrowser.pages.dev/"
Repository = "https://github.com/EasyBrowserMaster/easybrowser-local-api-sdk"

[tool.setuptools]
py-modules = ["easybrowser_sdk"]
